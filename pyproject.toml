[project]
name = "whopaid"
version = "0.1.0"
description = "Telegram group expense tracker for trips."
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21,<22",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
