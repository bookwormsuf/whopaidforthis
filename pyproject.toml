[project]
name = "whopaid"
version = "0.1.0"
description = "Telegram group expense tracker for trips."
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21,<22",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx",
    "asyncpg>=0.29",
    "python-ulid",
    "anthropic",
    "pillow",
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped so the session-scoped `postgres_pool` fixture (an asyncpg pool is
# bound to the loop it was created in) and every test that uses it share one loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "postgres: needs a real Postgres reachable at TEST_DATABASE_URL (skipped automatically if absent).",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
