# Local Postgres for the store tests (spec: docs/sprints/09-neon-store-and-export.md).
# `docker compose up -d`, then `uv run pytest -q`. CI runs the same image via a
# `services:` block instead of this file.
services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whopaid_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
